name: Sync Equipment List

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync equipment from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          AUDIO_WIKI_TOKEN: ${{ vars.WIKI_NODE_TOKEN }}
          AUDIO_TABLE_ID: ${{ vars.FEISHU_TABLE_ID }}

          INSTRUMENT_WIKI_TOKEN: ${{ vars.FEISHU_GENERAL_WIKI_TOKEN }}
          INSTRUMENT_TABLE_ID: ${{ vars.FEISHU_GENERAL_TABLE_ID }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          APP_ID = os.environ["FEISHU_APP_ID"]
          APP_SECRET = os.environ["FEISHU_APP_SECRET"]

          def request_json(url, method="GET", headers=None, data=None):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers=headers or {},
                  data=data
              )
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode("utf-8"))

          # --------------------------
          # AUTH
          # --------------------------

          auth = request_json(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              method="POST",
              headers={"Content-Type": "application/json"},
              data=json.dumps({
                  "app_id": APP_ID,
                  "app_secret": APP_SECRET
              }).encode("utf-8")
          )

          if auth.get("code") != 0:
              raise RuntimeError(auth)

          token = auth["tenant_access_token"]

          headers = {
              "Authorization": f"Bearer {token}"
          }

          # --------------------------
          # HELPERS
          # --------------------------

          def resolve_app_token(wiki_token):
              url = (
                  "https://open.feishu.cn/open-apis/wiki/v2/spaces/get_node?"
                  + urllib.parse.urlencode({"token": wiki_token})
              )

              response = request_json(url, headers=headers)

              if response.get("code") != 0:
                  raise RuntimeError(response)

              return response["data"]["node"]["obj_token"]


          def read_records(wiki_token, table_id):

              app_token = resolve_app_token(wiki_token)

              records = []
              page_token = None

              while True:

                  params = {"page_size": 500}

                  if page_token:
                      params["page_token"] = page_token

                  url = (
                      f"https://open.feishu.cn/open-apis/bitable/v1/apps/"
                      f"{app_token}/tables/{table_id}/records?"
                      + urllib.parse.urlencode(params)
                  )

                  response = request_json(url, headers=headers)

                  if response.get("code") != 0:
                      raise RuntimeError(response)

                  data = response["data"]

                  records.extend(data.get("items", []))

                  if not data.get("has_more"):
                      break

                  page_token = data.get("page_token")

              return records


          def text(value):

              if value is None:
                  return ""

              if isinstance(value, list):

                  values = []

                  for item in value:

                      if isinstance(item, dict):
                          values.append(
                              str(
                                  item.get(
                                      "text",
                                      item.get(
                                          "name",
                                          item.get(
                                              "record_id",
                                              ""
                                          )
                                      )
                                  )
                              )
                          )
                      else:
                          values.append(str(item))

                  return ", ".join(values)

              if isinstance(value, dict):
                  return str(
                      value.get(
                          "text",
                          value.get(
                              "name",
                              ""
                          )
                      )
                  )

              return str(value)


          def is_available(value):

              value = text(value).lower().strip()

              unavailable = [
                  "una.",
                  "unavailable",
                  "on loan",
                  "maintenance",
                  "维修",
                  "借出",
                  "不可用"
              ]

              if any(
                  word in value
                  for word in unavailable
              ):
                  return False

              return (
                  "avail" in value
                  or "available" in value
                  or "可用" in value
              )


          def parent_ids(value):
              result = []

              def collect(item):
                  if not item:
                      return

                  if isinstance(item, str):
                      # 飞书记录 ID 通常以 rec 开头
                      if item.startswith("rec"):
                          result.append(item)
                      return

                  if isinstance(item, list):
                      for child in item:
                          collect(child)
                      return

                  if isinstance(item, dict):
                      # 兼容不同版本的飞书关联记录格式
                      for key in [
                          "record_id",
                          "id",
                          "record_ids",
                          "link_record_ids",
                          "value",
                          "values"
                      ]:
                          if key in item:
                              collect(item[key])

              collect(value)

              # 去除重复的父记录 ID，同时保留原顺序
              return list(dict.fromkeys(result))

          def instrument_is_offsite(value):
              value = text(value).lower()

              return any(marker in value for marker in [
                  "不在棚里",
                  "不在棚",
                  "offsite",
                  "off-site",
                  "off site"
              ])


          def clean_instrument_name(value):
              value = text(value).strip()

              for marker in [
                  "（不在棚里）",
                  "(不在棚里)",
                  "（不在棚）",
                  "(不在棚)"
              ]:
                  value = value.replace(marker, "")

              return value.strip().replace("''", '"')

          def infer_instrument_type(parent, children):

              content = " ".join(
                  [
                      parent.get("name", "")
                  ]
                  +
                  [
                      child.get("name", "")
                      for child in children
                  ]
              ).lower()


              if any(word in content for word in [
                  "tom",
                  "kick",
                  "snare",
                  "cymbal",
                  "hi-hat",
                  "hihat",
                  "drum"
              ]):
                  return "Drums"


              if any(word in content for word in [
                  "piano",
                  "rhodes",
                  "keyboard",
                  "synth",
                  "organ"
              ]):
                  return "Keys"


              if any(word in content for word in [
                  "guitar",
                  "bass"
              ]):
                  return "Guitars & Basses"


              if any(word in content for word in [
                  "conga",
                  "bongo",
                  "shaker",
                  "tambourine",
                  "percussion"
              ]):
                  return "Percussion"


              return "Instruments"

          # ==================================================
          # AUDIO / MICROPHONES
          # ==================================================

          audio_records = read_records(
              os.environ["AUDIO_WIKI_TOKEN"],
              os.environ["AUDIO_TABLE_ID"]
          )

          audio_map = {}

          for record in audio_records:

              fields = record.get("fields", {})

              model = text(
                  fields.get("Microphone Model")
              ).strip()

              if not model:
                  continue

              brand = text(
                  fields.get("Manufacturer")
              ).strip()

              mic_type = text(
                  fields.get("Type")
              ).strip()

              polar = text(
                  fields.get("Polar Pattern")
              ).strip()

              status = fields.get("Status")

              key = (
                  brand.lower(),
                  model.lower()
              )

              if key not in audio_map:

                  audio_map[key] = {
                      "model": model,
                      "manufacturer": brand,
                      "category": "Audio",
                      "subcategory": "Microphones",
                      "type": mic_type,
                      "polarPattern": polar,
                      "total": 0,
                      "available": 0
                  }

              audio_map[key]["total"] += 1

              if is_available(status):
                  audio_map[key]["available"] += 1


          # ==================================================
          # INSTRUMENT
          # ==================================================

          instrument_records = read_records(
              os.environ["INSTRUMENT_WIKI_TOKEN"],
              os.environ["INSTRUMENT_TABLE_ID"]
          )

          all_records = {}

          children_by_parent = {}

          # First pass
          for record in instrument_records:

              record_id = record.get("record_id")

              fields = record.get("fields", {})

              item = {
                  "id": record_id,
                  "name": clean_instrument_name(
                      fields.get("KICK")
                  ),
                  "manufacturer": text(
                      fields.get("品牌")
                  ).strip(),
                  "size": text(
                      fields.get("尺寸")
                  ).strip(),
                  "depth": text(
                      fields.get("高度")
                  ).strip(),
                  "color": text(
                      fields.get("颜色")
                  ).strip(),
                  "available": (
                      is_available(fields.get("Status"))
                      and not instrument_is_offsite(
                          fields.get("KICK")
                      )
                  ),
                  "parents": parent_ids(
                      fields.get("父记录")
                  )
              }

              all_records[record_id] = item

              for parent_id in item["parents"]:

                  children_by_parent.setdefault(
                      parent_id,
                      []
                  ).append(item)


          instruments = []


          # Top-level records
          for record_id, item in all_records.items():

              if item["parents"]:
                  continue

              children = children_by_parent.get(
                  record_id,
                  []
              )

              # If parent itself has no status,
              # determine availability from children
              if children:

                  available_children = [
                      x for x in children
                      if x["available"]
                  ]

                  parent_available = (
                      len(available_children) > 0
                  )

              else:

                  parent_available = (
                      item["available"]
                  )


              subcategory = infer_instrument_type(
                  item,
                  children
              )


              instruments.append({
                  "model": item["name"],
                  "manufacturer": item["manufacturer"],
                  "category": "Instrument",
                  "subcategory": subcategory,
                  "color": item["color"],
                  "available": 1 if parent_available else 0,
                  "total": 1,
                  "children": [
                      {
                          "name": child["name"],
                          "size": child["size"],
                          "depth": child["depth"],
                          "available": child["available"]
                      }
                      for child in children
                  ]
              })


          # ==================================================
          # MERGE
          # ==================================================

          result = (
              list(audio_map.values())
              +
              instruments
          )

          result.sort(
              key=lambda x: (
                  x.get("category", ""),
                  x.get("subcategory", ""),
                  x.get("manufacturer", ""),
                  x.get("model", "")
              )
          )


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/equipment.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              f"✅ Audio models: {len(audio_map)}"
          )

          print(
              f"✅ Instrument models: {len(instruments)}"
          )

          print(
              f"✅ Total public equipment: {len(result)}"
          )

          PY


      - name: Commit updated equipment data
        run: |

          git config user.name \
            "CASMRE Equipment Sync"

          git config user.email \
            "actions@github.com"

          git add data/equipment.json

          if git diff --cached --quiet; then
            echo "No equipment changes."
            exit 0
          fi

          git commit \
            -m "Update equipment list"

          git push
