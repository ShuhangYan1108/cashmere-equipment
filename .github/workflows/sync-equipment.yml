name: Sync Equipment List

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync equipment from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          AUDIO_WIKI_TOKEN: ${{ vars.WIKI_NODE_TOKEN }}
          AUDIO_TABLE_ID: ${{ vars.FEISHU_TABLE_ID }}

          INSTRUMENT_WIKI_TOKEN: ${{ vars.FEISHU_GENERAL_WIKI_TOKEN }}

        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          APP_ID = os.environ["FEISHU_APP_ID"]
          APP_SECRET = os.environ["FEISHU_APP_SECRET"]


          def request_json(url, method="GET", headers=None, data=None):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers=headers or {},
                  data=data
              )

              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Feishu HTTP {error.code}: {body}"
                  ) from error


          def request_bytes(url, headers=None):
              req = urllib.request.Request(
                  url,
                  method="GET",
                  headers=headers or {}
              )

              try:
                  with urllib.request.urlopen(req) as response:
                      return (
                          response.read(),
                          response.headers.get_content_type()
                      )
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Feishu media HTTP {error.code}: {body}"
                  ) from error


          auth = request_json(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              method="POST",
              headers={"Content-Type": "application/json"},
              data=json.dumps({
                  "app_id": APP_ID,
                  "app_secret": APP_SECRET
              }).encode("utf-8")
          )

          if auth.get("code") != 0:
              raise RuntimeError(auth)

          token = auth["tenant_access_token"]
          headers = {"Authorization": f"Bearer {token}"}


          def resolve_app_token(wiki_token):
              url = (
                  "https://open.feishu.cn/open-apis/wiki/v2/spaces/get_node?"
                  + urllib.parse.urlencode({"token": wiki_token})
              )

              response = request_json(url, headers=headers)

              if response.get("code") != 0:
                  raise RuntimeError(response)

              return response["data"]["node"]["obj_token"]


          def paginated_items(url, page_size=50):
              items = []
              page_token = None

              while True:
                  params = {"page_size": page_size}

                  if page_token:
                      params["page_token"] = page_token

                  separator = "&" if "?" in url else "?"
                  response = request_json(
                      url + separator + urllib.parse.urlencode(params),
                      headers=headers
                  )

                  if response.get("code") != 0:
                      raise RuntimeError(response)

                  data = response.get("data", {})
                  items.extend(data.get("items", []))

                  if not data.get("has_more"):
                      break

                  page_token = data.get("page_token")

              return items


          def list_tables(app_token):
              return paginated_items(
                  f"https://open.feishu.cn/open-apis/bitable/v1/apps/{app_token}/tables",
                  page_size=20
              )


          def read_fields(app_token, table_id):
              return paginated_items(
                  f"https://open.feishu.cn/open-apis/bitable/v1/apps/"
                  f"{app_token}/tables/{table_id}/fields"
              )


          def read_records(app_token, table_id):
              return paginated_items(
                  f"https://open.feishu.cn/open-apis/bitable/v1/apps/"
                  f"{app_token}/tables/{table_id}/records",
                  page_size=500
              )


          def text(value):
              if value is None:
                  return ""

              if isinstance(value, list):
                  values = []

                  for item in value:
                      if isinstance(item, dict):
                          values.append(
                              str(
                                  item.get(
                                      "text",
                                      item.get(
                                          "name",
                                          item.get("record_id", "")
                                      )
                                  )
                              )
                          )
                      else:
                          values.append(str(item))

                  return ", ".join(filter(None, values))

              if isinstance(value, dict):
                  return str(value.get("text", value.get("name", "")))

              return str(value)


          def field_value(fields, *names):
              lookup = {
                  str(key).strip().casefold(): value
                  for key, value in fields.items()
              }

              for name in names:
                  key = name.strip().casefold()

                  if key in lookup:
                      return lookup[key]

              return None


          image_field_names = [
              "设备图片",
              "设备照片",
              "图片",
              "照片",
              "Equipment Image",
              "Image",
              "Photo"
          ]

          image_extensions = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp",
              ".gif",
              ".avif"
          }


          def attachment_items(value):
              if isinstance(value, list):
                  return [item for item in value if isinstance(item, dict)]

              if isinstance(value, dict):
                  return [value]

              return []


          def attachment_is_image(attachment, allow_unknown=False):
              mime_type = text(
                  attachment.get("type")
                  or attachment.get("mime_type")
                  or attachment.get("mimeType")
              ).lower()
              name = text(attachment.get("name")).lower()
              extension = os.path.splitext(name)[1]

              return (
                  mime_type.startswith("image/")
                  or extension in image_extensions
                  or allow_unknown
              )


          def first_image_attachment(fields):
              preferred = field_value(fields, *image_field_names)

              for attachment in attachment_items(preferred):
                  if (
                      attachment.get("file_token")
                      and attachment_is_image(attachment, allow_unknown=True)
                  ):
                      return attachment

              for value in fields.values():
                  for attachment in attachment_items(value):
                      if (
                          attachment.get("file_token")
                          and attachment_is_image(attachment)
                      ):
                          return attachment

              return None


          def safe_image_stem(value):
              stem = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  text(value).lower()
              ).strip("-")

              return (stem[:70] or "equipment")


          def image_extension(attachment, content_type):
              name_extension = os.path.splitext(
                  text(attachment.get("name")).lower()
              )[1]

              if name_extension in image_extensions:
                  return ".jpg" if name_extension == ".jpeg" else name_extension

              by_content_type = {
                  "image/jpeg": ".jpg",
                  "image/png": ".png",
                  "image/webp": ".webp",
                  "image/gif": ".gif",
                  "image/avif": ".avif"
              }

              return by_content_type.get(content_type, ".jpg")


          def sync_equipment_image(fields, image_name):
              attachment = first_image_attachment(fields)

              if not attachment:
                  return ""

              file_token = text(attachment.get("file_token"))
              token_suffix = safe_image_stem(file_token)[-10:]
              stem = safe_image_stem(image_name)

              os.makedirs("assets/equipment", exist_ok=True)

              existing = [
                  file_name
                  for file_name in os.listdir("assets/equipment")
                  if file_name.startswith(f"{stem}-{token_suffix}.")
              ]

              if existing:
                  return f"assets/equipment/{existing[0]}"

              media_url = (
                  "https://open.feishu.cn/open-apis/drive/v1/medias/"
                  f"{urllib.parse.quote(file_token)}/download"
              )
              try:
                  image_data, content_type = request_bytes(
                      media_url,
                      headers=headers
                  )
              except (RuntimeError, urllib.error.URLError) as error:
                  print(
                      f"⚠️ Image download skipped for {image_name}: {error}"
                  )
                  return ""
              extension = image_extension(attachment, content_type)
              relative_path = (
                  f"assets/equipment/{stem}-{token_suffix}{extension}"
              )

              with open(relative_path, "wb") as image_file:
                  image_file.write(image_data)

              return relative_path


          def primary_field_name(field_definitions):
              for field in field_definitions:
                  if field.get("is_primary"):
                      return field.get("field_name", "")

              if field_definitions:
                  return field_definitions[0].get("field_name", "")

              return ""


          def is_available(value):
              value = text(value).lower().strip()

              unavailable = [
                  "una.",
                  "unavailable",
                  "on loan",
                  "maintenance",
                  "维修",
                  "借出",
                  "不可用",
                  "已出售"
              ]

              if any(word in value for word in unavailable):
                  return False

              return (
                  "avail" in value
                  or "available" in value
                  or "可用" in value
              )


          def parent_ids(value):
              result = []

              def collect(item):
                  if not item:
                      return

                  if isinstance(item, str):
                      if item.startswith("rec"):
                          result.append(item)
                      return

                  if isinstance(item, list):
                      for child in item:
                          collect(child)
                      return

                  if isinstance(item, dict):
                      for key in [
                          "record_id",
                          "id",
                          "record_ids",
                          "link_record_ids",
                          "value",
                          "values"
                      ]:
                          if key in item:
                              collect(item[key])

              collect(value)
              return list(dict.fromkeys(result))


          unavailable_name_markers = [
              "不在棚里",
              "不在棚",
              "已出售",
              "已出借",
              "已借出"
          ]


          def instrument_is_unavailable_from_name(value):
              value = text(value).lower()

              return any(
                  marker.lower() in value
                  for marker in unavailable_name_markers
              )


          def clean_instrument_name(value):
              value = text(value).strip()

              for marker in unavailable_name_markers:
                  value = re.sub(
                      rf"\s*[（(]\s*{re.escape(marker)}\s*[）)]\s*",
                      " ",
                      value,
                      flags=re.IGNORECASE
                  )

              value = re.sub(r"\s+", " ", value).strip()
              return value.replace("''", '"')


          def public_instrument_subcategory(table_name):
              name = table_name.strip().casefold()

              if "芬达" in name or "fender" in name:
                  return "Guitars & Basses"
                    
              if any(word in name for word in [
                  "暂存",
                  "temporary",
                  "截止"
              ]):
                  return None

              if "套鼓" in name:
                  return "Drums"

              if "军鼓" in name or "snare" in name:
                  return "Drums"

              if "镲片" in name or "cymbal" in name:
                  return "Drums"

              if "键盘" in name or "keyboard" in name:
                  return "Keys"

              if "吉他音箱" in name or "guitar amp" in name:
                  return "Guitar Amps"

              if "贝斯音箱" in name or "bass amp" in name:
                  return "Bass Amps"

              return None


          # ==================================================
          # AUDIO / MICROPHONES
          # ==================================================

          audio_app_token = resolve_app_token(
              os.environ["AUDIO_WIKI_TOKEN"]
          )

          audio_records = read_records(
              audio_app_token,
              os.environ["AUDIO_TABLE_ID"]
          )

          audio_map = {}

          for record in audio_records:
              fields = record.get("fields", {})
              model = text(fields.get("Microphone Model")).strip()

              if not model:
                  continue

              brand = text(fields.get("Manufacturer")).strip()
              mic_type = text(fields.get("Type")).strip()
              polar = text(fields.get("Polar Pattern")).strip()
              status = fields.get("Status")
              key = (brand.lower(), model.lower())

              if key not in audio_map:
                  audio_map[key] = {
                      "model": model,
                      "manufacturer": brand,
                      "category": "Audio",
                      "subcategory": "Microphones",
                      "type": mic_type,
                      "polarPattern": polar,
                      "total": 0,
                      "available": 0
                  }

              if not audio_map[key].get("image"):
                  image_path = sync_equipment_image(
                      fields,
                      f"{brand}-{model}"
                  )

                  if image_path:
                      audio_map[key]["image"] = image_path

              audio_map[key]["total"] += 1

              if is_available(status):
                  audio_map[key]["available"] += 1


          # ==================================================
          # INSTRUMENT / ALL PUBLIC TABLES
          # ==================================================

          instrument_app_token = resolve_app_token(
              os.environ["INSTRUMENT_WIKI_TOKEN"]
          )

          all_instrument_tables = list_tables(instrument_app_token)
          public_tables = []

          for table in all_instrument_tables:
              table_name = text(table.get("name")).strip()
              subcategory = public_instrument_subcategory(table_name)

              if subcategory:
                  public_tables.append({
                      "table_id": table.get("table_id"),
                      "name": table_name,
                      "subcategory": subcategory
                  })

          print(
              "✅ Public instrument tables: "
              + ", ".join(table["name"] for table in public_tables)
          )

          instruments = []

          for table in public_tables:
              table_id = table["table_id"]
              table_name = table["name"]
              subcategory = table["subcategory"]

              field_definitions = read_fields(
                  instrument_app_token,
                  table_id
              )

              primary_field = primary_field_name(field_definitions)
              records = read_records(instrument_app_token, table_id)

              all_records = {}
              children_by_parent = {}

              for record in records:
                  record_id = record.get("record_id")
                  fields = record.get("fields", {})
                  raw_name = text(fields.get(primary_field)).strip()

                  if not record_id or not raw_name:
                      continue

                  status = field_value(fields, 'Status', '状态', 'State')
                  parent_value = field_value(
                      fields,
                      "父记录",
                      "Parent",
                      "Parent Record"
                  )

                  item = {
                      "id": record_id,
                      "name": clean_instrument_name(raw_name),
                      "manufacturer": text(field_value(
                          fields,
                          "品牌",
                          "Brand",
                          "Manufacturer",
                          "制造商"
                      )).strip(),
                      "size": text(field_value(
                          fields,
                          "尺寸",
                          "Size"
                      )).strip(),
                      "depth": text(field_value(
                          fields,
                          "高度",
                          "Height",
                          "Depth",
                          "深度"
                      )).strip(),
                      "color": text(field_value(
                          fields,
                          "颜色",
                          "Color"
                      )).strip(),
                      "year": text(field_value(
                          fields,
                          "生产年份",
                          "年份",
                          "Year",
                          "Year of Manufacture"
                      )).strip(),
                      "image": sync_equipment_image(
                          fields,
                          f"{table_name}-{raw_name}"
                      ),
                      "available": (
                          is_available(status)
                          and not instrument_is_unavailable_from_name(raw_name)
                      ),
                      "parents": parent_ids(parent_value)
                  }

                  all_records[record_id] = item

                  for parent_id in item["parents"]:
                      children_by_parent.setdefault(parent_id, []).append(item)

              table_instruments = []

              for record_id, item in all_records.items():
                  if item["parents"]:
                      continue

                  children = children_by_parent.get(record_id, [])

                  if children:
                      parent_available = any(
                          child["available"] for child in children
                      )
                  else:
                      parent_available = item["available"]

                  public_item = {
                      "model": item["name"],
                      "manufacturer": item["manufacturer"],
                      "category": "Instrument",
                      "subcategory": subcategory,
                      "color": item["color"],
                      "year": item["year"],
                      "image": item["image"],
                      "available": 1 if parent_available else 0,
                      "total": 1,
                      "children": [
                          {
                              "name": child["name"],
                              "size": child["size"],
                              "depth": child["depth"],
                              "year": child["year"],
                              "available": child["available"]
                          }
                          for child in children
                      ]
                  }

                  table_instruments.append(public_item)

              instruments.extend(table_instruments)

              print(
                  f"✅ {table_name}: {len(table_instruments)} public models"
              )


          # ==================================================
          # MERGE AND SAVE
          # ==================================================

          result = list(audio_map.values()) + instruments

          result.sort(
              key=lambda item: (
                  item.get("category", ""),
                  item.get("subcategory", ""),
                  item.get("manufacturer", ""),
                  item.get("model", "")
              )
          )

          os.makedirs("data", exist_ok=True)

          with open(
              "data/equipment.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"✅ Audio models: {len(audio_map)}")
          print(f"✅ Instrument models: {len(instruments)}")
          print(f"✅ Total public equipment: {len(result)}")

          PY

      - name: Commit updated equipment data
        run: |
          git config user.name "Cashmere Equipment Sync"
          git config user.email "actions@github.com"

          git add data/equipment.json

          if [ -d assets/equipment ]; then
            git add assets/equipment
          fi

          if git diff --cached --quiet; then
            echo "No equipment changes."
            exit 0
          fi

          git commit -m "Update equipment list"
          git push
