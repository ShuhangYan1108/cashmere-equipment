name: Sync Equipment List

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync equipment from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          MIC_WIKI_TOKEN: ${{ vars.WIKI_NODE_TOKEN }}
          MIC_TABLE_ID: ${{ vars.FEISHU_TABLE_ID }}

          GENERAL_WIKI_TOKEN: ${{ vars.FEISHU_GENERAL_WIKI_TOKEN }}
          GENERAL_TABLE_ID: ${{ vars.FEISHU_GENERAL_TABLE_ID }}

        run: |
          python3 <<'PY'

          import json
          import os
          import urllib.parse
          import urllib.request
          from collections import OrderedDict

          APP_ID = os.environ["FEISHU_APP_ID"]
          APP_SECRET = os.environ["FEISHU_APP_SECRET"]

          def request_json(url, method="GET", headers=None, data=None):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers=headers or {},
                  data=data
              )

              with urllib.request.urlopen(req) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # -----------------------------------
          # Get tenant_access_token
          # -----------------------------------

          auth_body = json.dumps({
              "app_id": APP_ID,
              "app_secret": APP_SECRET
          }).encode("utf-8")

          auth = request_json(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              method="POST",
              headers={
                  "Content-Type": "application/json"
              },
              data=auth_body
          )

          if auth.get("code") != 0:
              raise RuntimeError(auth)

          token = auth["tenant_access_token"]

          headers = {
              "Authorization": f"Bearer {token}"
          }


          # -----------------------------------
          # Helper functions
          # -----------------------------------

          def normalize(value):

              if value is None:
                  return ""

              if isinstance(value, bool):
                  return value

              if isinstance(value, list):

                  result = []

                  for x in value:

                      if isinstance(x, dict):
                          result.append(
                              x.get(
                                  "text",
                                  x.get(
                                      "name",
                                      str(x)
                                  )
                              )
                          )

                      else:
                          result.append(str(x))

                  return ", ".join(result)

              if isinstance(value, dict):

                  return value.get(
                      "text",
                      value.get(
                          "name",
                          str(value)
                      )
                  )

              return str(value)


          def first_field(fields, candidates, default=""):

              for name in candidates:

                  if name in fields:

                      value = normalize(
                          fields.get(name)
                      )

                      if value != "":
                          return value

              return default


          def resolve_app_token(wiki_token):

              url = (
                  "https://open.feishu.cn/open-apis/"
                  "wiki/v2/spaces/get_node?"
                  + urllib.parse.urlencode({
                      "token": wiki_token
                  })
              )

              response = request_json(
                  url,
                  headers=headers
              )

              if response.get("code") != 0:
                  raise RuntimeError(response)

              return response[
                  "data"
              ]["node"]["obj_token"]


          def read_records(wiki_token, table_id):

              app_token = resolve_app_token(
                  wiki_token
              )

              records = []
              page_token = None

              while True:

                  params = {
                      "page_size": 500
                  }

                  if page_token:
                      params[
                          "page_token"
                      ] = page_token

                  url = (
                      "https://open.feishu.cn/"
                      "open-apis/bitable/v1/apps/"
                      f"{app_token}/tables/"
                      f"{table_id}/records?"
                      + urllib.parse.urlencode(
                          params
                      )
                  )

                  response = request_json(
                      url,
                      headers=headers
                  )

                  if response.get("code") != 0:
                      raise RuntimeError(response)

                  data = response["data"]

                  records.extend(
                      data.get("items", [])
                  )

                  if not data.get("has_more"):
                      break

                  page_token = data.get(
                      "page_token"
                  )

              return records


          def is_available(status):

              value = str(status).strip().lower()

              unavailable_words = [
                  "unavailable",
                  "una.",
                  "on loan",
                  "maintenance",
                  "reserved",
                  "维修",
                  "借出",
                  "不可用",
                  "停用"
              ]

              for word in unavailable_words:

                  if word in value:
                      return False

              available_words = [
                  "avail",
                  "available",
                  "可用",
                  "在库"
              ]

              for word in available_words:

                  if word in value:
                      return True

              return False


          # -----------------------------------
          # Data sources
          # -----------------------------------

          sources = [

              {
                  "name": "Microphones",
                  "wiki": os.environ[
                      "MIC_WIKI_TOKEN"
                  ],
                  "table": os.environ[
                      "MIC_TABLE_ID"
                  ],
                  "default_category": "Audio",
                  "default_subcategory": "Microphones"
              },

              {
                  "name": "General Equipment",
                  "wiki": os.environ[
                      "GENERAL_WIKI_TOKEN"
                  ],
                  "table": os.environ[
                      "GENERAL_TABLE_ID"
                  ],
                  "default_category": "Audio",
                  "default_subcategory": "Equipment"
              }

          ]


          equipment = OrderedDict()


          # -----------------------------------
          # Read and normalize
          # -----------------------------------

          for source in sources:

              records = read_records(
                  source["wiki"],
                  source["table"]
              )

              print(
                  f'✅ {source["name"]}: '
                  f'{len(records)} records'
              )

              for record in records:

                  fields = record.get(
                      "fields",
                      {}
                  )

                  model = first_field(
                      fields,
                      [
                          "Microphone Model",
                          "Equipment Model",
                          "Equipment Name",
                          "Model",
                          "设备名称",
                          "设备型号"
                      ]
                  )

                  if not model:
                      continue


                  manufacturer = first_field(
                      fields,
                      [
                          "Manufacturer",
                          "Brand",
                          "品牌",
                          "制造商"
                      ]
                  )


                  status = first_field(
                      fields,
                      [
                          "Status",
                          "Availability",
                          "设备状态",
                          "状态"
                      ]
                  )


                  category = first_field(
                      fields,
                      [
                          "Category",
                          "Equipment Category",
                          "一级分类",
                          "大类"
                      ],
                      source[
                          "default_category"
                      ]
                  )


                  subcategory = first_field(
                      fields,
                      [
                          "Subcategory",
                          "Sub Category",
                          "Equipment Type",
                          "二级分类",
                          "小类"
                      ],
                      source[
                          "default_subcategory"
                      ]
                  )


                  equipment_type = first_field(
                      fields,
                      [
                          "Type",
                          "Device Type",
                          "设备类型"
                      ]
                  )


                  polar_pattern = first_field(
                      fields,
                      [
                          "Polar Pattern",
                          "指向性"
                      ]
                  )


                  key = (
                      str(manufacturer).lower(),
                      str(model).lower(),
                      str(category).lower(),
                      str(subcategory).lower()
                  )


                  if key not in equipment:

                      equipment[key] = {

                          "model":
                              model,

                          "manufacturer":
                              manufacturer,

                          "category":
                              category,

                          "subcategory":
                              subcategory,

                          "type":
                              equipment_type,

                          "polarPattern":
                              polar_pattern,

                          "total":
                              0,

                          "available":
                              0

                      }


                  equipment[key]["total"] += 1


                  if is_available(status):

                      equipment[key][
                          "available"
                      ] += 1


          # -----------------------------------
          # Sort output
          # -----------------------------------

          result = list(
              equipment.values()
          )

          result.sort(
              key=lambda x: (
                  x["category"],
                  x["subcategory"],
                  x["manufacturer"],
                  x["model"]
              )
          )


          # -----------------------------------
          # Write JSON
          # -----------------------------------

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/equipment.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              f"✅ Generated "
              f"{len(result)} equipment models."
          )

          PY


      - name: Commit updated equipment data
        run: |

          git config \
            user.name \
            "CASMRE Equipment Sync"

          git config \
            user.email \
            "actions@github.com"

          git add data/equipment.json

          if git diff --cached --quiet; then
            echo "No equipment changes."
            exit 0
          fi

          git commit \
            -m "Update equipment list"

          git push
