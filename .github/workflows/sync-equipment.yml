name: Sync Equipment List

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync equipment from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          WIKI_NODE_TOKEN: ${{ vars.WIKI_NODE_TOKEN }}
          FEISHU_TABLE_ID: ${{ vars.FEISHU_TABLE_ID }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from collections import OrderedDict

          APP_ID = os.environ["FEISHU_APP_ID"]
          APP_SECRET = os.environ["FEISHU_APP_SECRET"]
          WIKI_TOKEN = os.environ["WIKI_NODE_TOKEN"]
          TABLE_ID = os.environ["FEISHU_TABLE_ID"]

          def request_json(url, method="GET", headers=None, data=None):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers=headers or {},
                  data=data
              )
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode("utf-8"))

          # 1. 获取 tenant_access_token
          auth_body = json.dumps({
              "app_id": APP_ID,
              "app_secret": APP_SECRET
          }).encode("utf-8")

          auth = request_json(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              method="POST",
              headers={"Content-Type": "application/json"},
              data=auth_body
          )

          if auth.get("code") != 0:
              raise RuntimeError(auth)

          token = auth["tenant_access_token"]

          headers = {
              "Authorization": f"Bearer {token}"
          }

          # 2. Wiki Token → Bitable App Token
          wiki_url = (
              "https://open.feishu.cn/open-apis/wiki/v2/spaces/get_node?"
              + urllib.parse.urlencode({"token": WIKI_TOKEN})
          )

          wiki = request_json(wiki_url, headers=headers)

          if wiki.get("code") != 0:
              raise RuntimeError(wiki)

          app_token = wiki["data"]["node"]["obj_token"]

          # 3. 读取全部设备记录
          records = []
          page_token = None

          while True:
              params = {"page_size": 500}

              if page_token:
                  params["page_token"] = page_token

              url = (
                  f"https://open.feishu.cn/open-apis/bitable/v1/apps/"
                  f"{app_token}/tables/{TABLE_ID}/records?"
                  + urllib.parse.urlencode(params)
              )

              response = request_json(url, headers=headers)

              if response.get("code") != 0:
                  raise RuntimeError(response)

              data = response["data"]
              records.extend(data.get("items", []))

              if not data.get("has_more"):
                  break

              page_token = data.get("page_token")

          # 4. 按型号整理
          equipment = OrderedDict()

          for record in records:
              fields = record.get("fields", {})

              model = fields.get("Microphone Model")
              if not model:
                  continue

              manufacturer = fields.get("Manufacturer", "")
              status = fields.get("Status", "")
              mic_type = fields.get("Type", "")
              polar_pattern = fields.get("Polar Pattern", "")

              # 飞书单选字段有时返回字符串，有时返回结构
              def normalize(value):
                  if isinstance(value, list):
                      return [
                          x.get("text", x.get("name", str(x)))
                          if isinstance(x, dict) else str(x)
                          for x in value
                      ]
                  if isinstance(value, dict):
                      return value.get("text", value.get("name", str(value)))
                  return value

              manufacturer = normalize(manufacturer)
              status = normalize(status)
              mic_type = normalize(mic_type)
              polar_pattern = normalize(polar_pattern)

              key = str(model).strip()

              if key not in equipment:
                  equipment[key] = {
                      "model": key,
                      "manufacturer": manufacturer,
                      "type": mic_type,
                      "polarPattern": polar_pattern,
                      "total": 0,
                      "available": 0
                  }

              equipment[key]["total"] += 1

              status_text = str(status).strip().lower()

              if status_text.startswith("avail"):
                  equipment[key]["available"] += 1

          result = list(equipment.values())

          # 5. 生成 JSON
          os.makedirs("data", exist_ok=True)

          with open("data/equipment.json", "w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"✅ Synced {len(records)} individual devices.")
          print(f"✅ Generated {len(result)} equipment models.")

          for item in result[:10]:
              print(
                  f'{item["model"]}: '
                  f'{item["available"]}/{item["total"]} available'
              )
          PY

      - name: Commit updated equipment data
        run: |
          git config user.name "CASMRE Equipment Sync"
          git config user.email "actions@github.com"

          git add data/equipment.json

          if git diff --cached --quiet; then
            echo "No equipment changes."
            exit 0
          fi

          git commit -m "Update equipment list"
          git push
